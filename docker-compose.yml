services:
  weixin:
    build:
      context: .
      args:
        # dsh 版本（npm 发布的 @deepseek-ai/dsh）。
        DSH_VERSION: 0.1.0-rc.6
        # 插件仓库的分支 / tag（shallow clone，需是分支或 tag 名）。
        BRIDGE_REF: master
    image: dsh-weixin:latest
    env_file:
      - .env
    environment:
      # 容器内 dsh 数据目录；挂载同名 volume 以持久化会话与微信映射。
      DSH_HOME: /opt/dsh-home
      # Agent 工作目录（容器内路径）；挂载你的项目目录即可让 bot 直接操作代码。
      WEIXIN_WORKSPACE: /workspace
    volumes:
      - dsh-home:/opt/dsh-home
      - ./workspace:/workspace
    restart: unless-stopped

volumes:
  dsh-home:
